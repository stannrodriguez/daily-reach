<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #E9EBE3; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  a { color: #6D4AA0; text-decoration: none; }
  a:hover { color: #1B1C16; }
  ::selection { background: #DCD2EC; }

  .page {
    min-height: 100vh;
    background: #E9EBE3;
    display: flex;
    justify-content: center;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    color: #1B1C16;
  }
  .shell {
    width: 100%;
    max-width: 460px;
    background: #F3F5EF;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    transition: max-width 0.2s ease;
  }

  .serif { font-family: Newsreader, serif; }

  /* ——— chips ——— */
  .chip {
    font-size: 12px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    padding: 6px 13px;
    border-radius: 100px;
    border: 1px solid #DCDFD2;
    color: #6E7263;
    background: transparent;
  }
  .chip.on { border-color: #6D4AA0; color: #FFFFFF; background: #6D4AA0; }

  /* ——— nav ——— */
  .topnav { display: none; align-items: center; justify-content: space-between; padding: 22px 28px 0; }
  .topnav .wordmark {
    font-family: Newsreader, serif;
    font-size: 22px;
    letter-spacing: -0.01em;
    min-height: 28px;
  }
  .topnav .links { display: flex; gap: 8px; }
  .topnav .links button {
    padding: 8px 14px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 100px;
    color: #A6AA98;
    background: transparent;
  }
  .topnav .links button.on { color: #1B1C16; background: #E9EBE0; }

  .navbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .navbar .inner {
    width: 100%;
    max-width: 460px;
    background: #F3F5EFF2;
    backdrop-filter: blur(6px);
    border-top: 1px solid #E3E6DA;
    display: flex;
    pointer-events: auto;
    transition: max-width 0.2s ease;
  }
  .navbar button {
    flex: 1;
    padding: 16px 0 22px;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #A6AA98;
  }
  .navbar button.on { color: #1B1C16; }

  /* ——— home ——— */
  .home { padding: 68px 28px 120px; }
  .home .mark { font-family: Newsreader, serif; font-size: 56px; line-height: 1; letter-spacing: -0.02em; font-weight: 400; }
  .home .tagline {
    font-family: Newsreader, serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.5;
    color: #6E7263;
    margin-top: 14px;
    max-width: 300px;
    text-wrap: pretty;
  }
  .home .rule { height: 1px; background: #DCDFD2; margin: 34px 0 30px; }

  .resume-wrap { position: relative; margin-bottom: 26px; }
  .resume {
    display: block;
    width: 100%;
    text-align: left;
    background: #6D4AA0;
    border-radius: 3px;
    padding: 18px 20px;
  }
  .resume:hover { background: #5A3C87; }
  .resume .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #DCD2EC; }
  .resume .name { font-family: Newsreader, serif; font-size: 24px; line-height: 1.2; color: #FFFFFF; margin-top: 6px; padding-right: 26px; }
  .resume .at { display: flex; align-items: center; gap: 9px; font-size: 13px; color: #DCD2EC; margin-top: 9px; }
  .resume .at .thumb {
    width: 40px;
    height: 28px;
    border-radius: 2px;
    overflow: hidden;
    flex: none;
    background: #FFFFFF29;
  }
  .resume .at .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.5); }
  .resume-clear {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 15px;
    line-height: 1;
    color: #C5B4E0;
    padding: 8px 11px;
    border-radius: 100px;
  }
  .resume-clear:hover { color: #FFFFFF; background: #00000026; }

  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8E7E; }
  .time-options { display: flex; gap: 8px; margin-top: 14px; }
  .time-matches { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .match {
    width: 100%;
    text-align: left;
    background: #FFFFFF;
    border: 1px solid #E3E6DA;
    border-radius: 3px;
    padding: 18px 20px;
  }
  .match:hover { border-color: #6D4AA0; }
  .match .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .match .name { font-family: Newsreader, serif; font-size: 24px; line-height: 1.2; }
  .match .mins { font-size: 13px; color: #8A8E7E; white-space: nowrap; }
  .match .note { display: block; font-size: 13px; line-height: 1.55; color: #6E7263; margin-top: 6px; text-wrap: pretty; }

  .thought {
    margin-top: 46px;
    font-family: Newsreader, serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.55;
    color: #6D4AA0;
    text-wrap: pretty;
  }

  /* ——— library ——— */
  .library { padding: 60px 0 120px; }
  .library .head { padding: 0 28px; }
  .page-title { font-family: Newsreader, serif; font-size: 38px; line-height: 1; }
  .library .count { font-size: 14px; color: #6E7263; margin-top: 10px; line-height: 1.5; }
  .library .kinds { display: flex; gap: 8px; padding: 22px 28px 0; }
  .library .tags { display: flex; gap: 8px; padding: 10px 28px 0; flex-wrap: wrap; }
  .library .grid { padding: 0 28px; display: flex; flex-direction: column; gap: 20px; margin-top: 26px; }

  .move { background: #FFFFFF; border: 1px solid #E3E6DA; border-radius: 3px; padding: 24px; }
  .move .slot {
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
    position: relative;
    background: repeating-linear-gradient(45deg, #EDEFE7 0px, #EDEFE7 10px, #F3F5EF 10px, #F3F5EF 20px);
  }
  .move .slot .note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #9A9E8D;
  }
  .move .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .move .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .move .name { font-family: Newsreader, serif; font-size: 25px; line-height: 1.2; }
  .move .kind { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #9A9E8D; white-space: nowrap; }
  .move .text { font-size: 15px; line-height: 1.62; color: #3D4034; margin-top: 10px; text-wrap: pretty; }
  .move .cue {
    font-family: Newsreader, serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.5;
    color: #6D4AA0;
    margin-top: 10px;
    text-wrap: pretty;
  }
  .move .swap {
    font-size: 13px;
    line-height: 1.5;
    color: #6E7263;
    margin-top: 10px;
    padding-left: 14px;
    border-left: 1px solid #C9CDBC;
  }
  .move .taglist { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .move .taglist span {
    font-size: 11px;
    letter-spacing: 0.06em;
    white-space: nowrap;
    color: #7B7F6E;
    border: 1px solid #DCDFD2;
    border-radius: 100px;
    padding: 3px 9px;
  }

  /* ——— routines ——— */
  .routines { padding: 60px 28px 120px; }
  .routines .sub { font-size: 14px; color: #6E7263; margin-top: 10px; line-height: 1.5; max-width: 320px; text-wrap: pretty; }
  .routines-list { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  .routine-card {
    background: #FFFFFF;
    border: 1px solid #E3E6DA;
    border-radius: 3px;
    padding: 20px 22px;
    text-align: left;
    width: 100%;
  }
  .routine-card:hover { border-color: #6D4AA0; }
  .routine-card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .routine-card .name { font-family: Newsreader, serif; font-size: 25px; line-height: 1.2; }
  .routine-card .meta { font-size: 12px; color: #8A8E7E; white-space: nowrap; }
  .routine-card .note { font-size: 14px; line-height: 1.55; color: #6E7263; margin-top: 7px; text-wrap: pretty; }

  .build-cta {
    margin-top: 26px;
    width: 100%;
    border: 1px dashed #C2C6B4;
    border-radius: 3px;
    padding: 16px;
    font-size: 14px;
    color: #4C5043;
  }
  .build-cta:hover { border-color: #6D4AA0; color: #6D4AA0; }

  /* ——— routine detail + builder ——— */
  .detail { padding: 24px 28px 140px; }
  .back { font-size: 13px; color: #8A8E7E; padding: 12px 0; }
  .back:hover { color: #1B1C16; }
  .detail .title { font-family: Newsreader, serif; font-size: 40px; line-height: 1.05; margin-top: 12px; }
  .detail .meta { font-size: 13px; color: #8A8E7E; margin-top: 10px; }
  .detail .note { font-size: 15px; line-height: 1.6; color: #4C5043; margin-top: 14px; text-wrap: pretty; }
  .detail .credit { font-family: Newsreader, serif; font-style: italic; font-size: 16px; color: #6D4AA0; margin-top: 10px; }
  .detail .actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-primary {
    background: #6D4AA0;
    color: #FFFFFF;
    border-radius: 3px;
    padding: 15px;
    font-size: 15px;
    letter-spacing: 0.01em;
  }
  .btn-primary:hover { background: #5A3C87; }
  .detail .actions .btn-primary { flex: 1; }
  .btn-quiet { border: 1px solid #E3E6DA; border-radius: 3px; padding: 15px 18px; font-size: 14px; color: #8A8E7E; }
  .btn-quiet:hover { color: #1B1C16; }

  .steps { margin-top: 34px; display: flex; flex-direction: column; }
  .step { display: flex; gap: 16px; padding: 13px 0; border-top: 1px solid #E3E6DA; }
  .step .n { font-size: 12px; color: #A6AA98; width: 22px; flex: none; padding-top: 5px; font-variant-numeric: tabular-nums; }
  .step .mid { flex: 1; }
  .step .name { font-family: Newsreader, serif; font-size: 20px; line-height: 1.3; }
  .step .sub { font-size: 12px; color: #8A8E7E; margin-top: 3px; }
  .step .dur { font-size: 13px; color: #6E7263; padding-top: 5px; font-variant-numeric: tabular-nums; }

  .builder .title { font-family: Newsreader, serif; font-size: 36px; line-height: 1.05; margin-top: 12px; }
  .builder .name-input {
    width: 100%;
    margin-top: 22px;
    background: transparent;
    border: none;
    border-bottom: 1px solid #C2C6B4;
    padding: 10px 0;
    font-family: Newsreader, serif;
    font-size: 24px;
    outline: none;
  }
  .builder .bsteps { margin-top: 26px; }
  .bstep { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid #E3E6DA; }
  .bstep .name { flex: 1; font-family: Newsreader, serif; font-size: 19px; }
  .bstep input {
    width: 62px;
    background: #FFFFFF;
    border: 1px solid #E3E6DA;
    border-radius: 3px;
    padding: 6px 8px;
    font-size: 13px;
    text-align: right;
  }
  .bstep .unit { font-size: 12px; color: #8A8E7E; }
  .bstep .rm { font-size: 16px; color: #A6AA98; padding: 0 4px; }
  .bstep .rm:hover { color: #6D4AA0; }
  .builder .hint { font-size: 13px; color: #8A8E7E; margin-top: 14px; }
  .builder .save { margin-top: 18px; width: 100%; }
  .builder .add-head { margin-top: 40px; }
  .builder .kinds { display: flex; gap: 8px; margin-top: 14px; }
  .builder .picker { margin-top: 14px; }
  .pick {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 11px 0;
    border-top: 1px solid #E3E6DA;
  }
  .pick:hover { color: #6D4AA0; }
  .pick .name { font-family: Newsreader, serif; font-size: 19px; }
  .pick .plus { font-size: 15px; color: #A6AA98; }

  /* ——— player ——— */
  .player {
    position: fixed;
    inset: 0;
    background: #F3F5EF;
    display: flex;
    justify-content: center;
    z-index: 20;
  }
  .player .col {
    width: 100%;
    max-width: 460px;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 28px 34px;
  }
  .player .bar { height: 2px; background: #E3E6DA; margin: 0 -28px; }
  .player .bar > div { height: 2px; background: #6D4AA0; width: 0%; }
  .player .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
  .player .top .right { display: flex; align-items: center; gap: 14px; }
  .player .close { font-size: 13px; color: #8A8E7E; }
  .player .close:hover { color: #1B1C16; }
  .player .sound {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #A6AA98;
    border: 1px solid #E3E6DA;
    border-radius: 100px;
    padding: 5px 11px;
  }
  .player .sound.on { color: #6D4AA0; border-color: #D3C6E6; background: #F0EBF7; }
  .player .progress { font-size: 12px; color: #8A8E7E; font-variant-numeric: tabular-nums; }
  .player .pinned { text-align: center; padding-top: 4px; }
  .player .side { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6D4AA0; height: 14px; }
  .player .pose { font-family: Newsreader, serif; font-size: 34px; line-height: 1.15; margin-top: 10px; text-wrap: pretty; }
  .player .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    text-align: center;
    padding: 8px 0;
  }
  .player .illus {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 16/10;
    max-height: 28vh;
    flex: none;
    margin-top: 14px;
    border-radius: 3px;
    overflow: hidden;
    background: repeating-linear-gradient(45deg, #EDEFE7 0px, #EDEFE7 10px, #F3F5EF 10px, #F3F5EF 20px);
  }
  .player .illus .note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #9A9E8D;
    padding: 0 12px;
    text-align: center;
  }
  .player .illus img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .breath {
    position: relative;
    width: 240px;
    height: 240px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 18px 0 6px;
  }
  .breath .fill {
    position: absolute;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: #E4DDF1;
    opacity: 0.55;
    transform: scale(0.62);
  }
  .breath .ring { position: absolute; width: 240px; height: 240px; border-radius: 50%; border: 1px solid #DCDFD2; }
  .breath .time {
    position: relative;
    font-family: Newsreader, serif;
    font-size: 52px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .player .breath-label { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8A8E7E; height: 16px; }
  .player .text { font-size: 14px; line-height: 1.6; color: #4C5043; margin-top: 22px; max-width: 330px; text-wrap: pretty; }
  .player .cue {
    font-family: Newsreader, serif;
    font-style: italic;
    font-size: 17px;
    line-height: 1.5;
    color: #6D4AA0;
    margin-top: 12px;
    max-width: 330px;
    text-wrap: pretty;
  }
  .player .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-top: 1px solid #E3E6DA;
    padding-top: 20px;
  }
  .player .controls .step-btn { font-size: 14px; color: #6E7263; padding: 8px 4px; }
  .player .controls .step-btn:hover { color: #1B1C16; }
  .player .controls .play { background: #6D4AA0; color: #FFFFFF; border-radius: 100px; padding: 13px 40px; font-size: 15px; }
  .player .controls .play:hover { background: #5A3C87; }
  .player .next {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 28px;
    font-size: 12px;
    color: #A6AA98;
    margin-top: 12px;
  }
  .player .next .thumb {
    width: 46px;
    height: 30px;
    border-radius: 2px;
    overflow: hidden;
    flex: none;
    background: repeating-linear-gradient(45deg, #EDEFE7 0px, #EDEFE7 6px, #F3F5EF 6px, #F3F5EF 12px);
  }
  /* the figures sit small inside their frame — zoom in so they read at thumbnail size */
  .player .next .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.5); }
  .player .next .thumb.empty { display: none; }

  /* ——— the beat between moves ——— */
  .player.is-transition .side { color: #6D4AA0; }
  .player.is-transition .pose { color: #6D4AA0; }
  .player.is-transition .breath .fill { background: #DCD2EC; opacity: 0.7; }
  .player.is-transition .breath .time { font-size: 66px; color: #6D4AA0; }
  .player.is-transition .illus { box-shadow: 0 0 0 1px #D3C6E6; }

  .hidden { display: none !important; }

  /* ——— short screens: keep image + timer on one glance ——— */
  @media (max-height: 900px) {
    .breath, .breath .fill, .breath .ring { width: 172px; height: 172px; }
    .breath .time { font-size: 38px; }
    .player.is-transition .breath .time { font-size: 52px; }
    .breath { margin: 10px 0 2px; }
    .player .illus { max-width: 260px; margin-top: 8px; }
    .player .pose { font-size: 27px; }
    .player .text { margin-top: 12px; }
    .player .cue { margin-top: 8px; }
  }

  /* ——— desktop ——— */
  @media (min-width: 860px) {
    .shell.wide { max-width: 920px; }
    .topnav { display: flex; }
    .navbar { display: none; }
    .home { max-width: 720px; margin: 0 auto; padding-top: 96px; }
    .time-matches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-items: stretch; }
    .routines-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; align-items: stretch; }
    .library .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="shell" id="shell">
    <div class="topnav" id="topnav">
      <div class="wordmark" id="topnav-wordmark"></div>
      <div class="links" id="topnav-links"></div>
    </div>
    <div id="view"></div>
  </div>
</div>

<div class="navbar" id="navbar"><div class="inner" id="navbar-links"></div></div>
<div id="player-root"></div>

<script src="reach-data.js"></script>
<script>
(function () {
  "use strict";

  var BREATH_CYCLE = 8;
  var TRANSITION_SEC = 4; // the beat between moves

  var state = {
    ready: false,
    moves: [], routines: [], thoughts: [], images: [], custom: [],
    view: 'home',
    kind: 'all', tag: 'all',
    routineId: null,
    timeFilter: 15,
    resume: null,
    player: null,
    sound: true,
    builderName: '', builderSteps: [],
  };

  // ——— tiny DOM helpers ———
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function btn(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  // ——— storage ———
  function load(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // ——— data helpers ———
  function allRoutines() { return state.routines.concat(state.custom); }
  function routineById(id) {
    var all = allRoutines();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return undefined;
  }
  function moveById(id) {
    for (var i = 0; i < state.moves.length; i++) if (state.moves[i].id === id) return state.moves[i];
    return { id: id, name: id, text: '', tags: [] };
  }
  function expand(r) {
    if (!r) return [];
    var rounds = r.rounds || 1;
    var out = [];
    for (var i = 0; i < rounds; i++) {
      r.steps.forEach(function (st) {
        out.push({
          id: st.id, sec: st.sec, side: st.side || '', reps: st.reps || '',
          round: rounds > 1 ? 'Round ' + (i + 1) + ' of ' + rounds : '',
        });
      });
    }
    return out;
  }
  function fmt(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function todaysThought() {
    if (!state.thoughts.length) return '';
    return state.thoughts[new Date().getDate() % state.thoughts.length];
  }

  function imagePath(id) {
    return state.images.indexOf(id) > -1 ? 'images/' + id + '.png' : '';
  }
  function thumbFor(id, cls) {
    var wrap = el('div', cls || 'thumb');
    var src = imagePath(id);
    if (!src) { wrap.classList.add('empty'); return wrap; }
    var img = el('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('error', function () { wrap.classList.add('empty'); });
    wrap.appendChild(img);
    return wrap;
  }

  // ——— navigation ———
  function go(view) { state.view = view; render(); }

  // Viewing a routine is browsing, not a session — it never writes a resume point.
  function openRoutine(id) {
    state.routineId = id;
    state.view = 'routine';
    render();
  }

  // ——— resume: an actual place in an actual session ———
  function saveResume() {
    var p = state.player;
    if (!p) return;
    var r = routineById(p.routineId);
    if (!r) return;
    // Mid-transition, the place to come back to is the move you were heading into.
    var i = p.phase === 'transition' ? Math.min(p.i + 1, p.steps.length - 1) : p.i;
    var s = p.steps[i];
    state.resume = {
      id: r.id, name: r.name, i: i, total: p.steps.length,
      step: moveById(s.id).name, moveId: s.id, side: s.side || '',
    };
    save('reach.resume', state.resume);
  }
  function clearResume() {
    state.resume = null;
    save('reach.resume', null);
  }
  function resumeSession() {
    var res = state.resume;
    if (!res) return;
    if (!routineById(res.id)) { clearResume(); render(); return; }
    state.routineId = res.id;
    startPlayer(res.i);
  }

  // ——— home ———
  function renderHome() {
    var root = el('div', 'home');

    var head = el('div');
    head.appendChild(el('div', 'mark', 'Reach'));
    head.appendChild(el('div', 'tagline', 'Everything out of reach is just training away.'));
    head.appendChild(el('div', 'rule'));
    root.appendChild(head);

    var body = el('div');

    if (state.resume) {
      var res = state.resume;
      var wrap = el('div', 'resume-wrap');
      var resume = btn('resume', null, resumeSession);
      resume.appendChild(el('div', 'label', 'Continue'));
      resume.appendChild(el('div', 'name', res.name));

      var at = el('div', 'at');
      at.appendChild(thumbFor(res.moveId));
      at.appendChild(el('span', null,
        'Step ' + (res.i + 1) + ' of ' + res.total + ' · ' + res.step + (res.side ? ' · ' + res.side : '')));
      resume.appendChild(at);
      wrap.appendChild(resume);

      var clearBtn = btn('resume-clear', '×', function () { clearResume(); render(); });
      clearBtn.setAttribute('aria-label', 'Discard saved session');
      wrap.appendChild(clearBtn);
      body.appendChild(wrap);
    }

    body.appendChild(el('div', 'eyebrow', 'How much time do you have?'));

    var options = el('div', 'time-options');
    [3, 5, 15, 28].forEach(function (m) {
      options.appendChild(btn('chip' + (state.timeFilter === m ? ' on' : ''), m + ' min', function () {
        state.timeFilter = m;
        render();
      }));
    });
    body.appendChild(options);

    var matches = el('div', 'time-matches');
    allRoutines()
      .filter(function (r) { return r.mins <= state.timeFilter; })
      .sort(function (a, b) { return b.mins - a.mins; })
      .slice(0, 4)
      .forEach(function (r) {
        var b = btn('match', null, function () { openRoutine(r.id); });
        var row = el('span', 'row');
        row.appendChild(el('span', 'name', r.name));
        row.appendChild(el('span', 'mins', r.mins + ' min'));
        b.appendChild(row);
        b.appendChild(el('span', 'note', r.note || ''));
        matches.appendChild(b);
      });
    body.appendChild(matches);

    body.appendChild(el('div', 'thought', todaysThought()));
    root.appendChild(body);
    return root;
  }

  // ——— library ———
  var KINDS = [['all', 'All'], ['yoga', 'Yoga'], ['calisthenics', 'Calisthenics']];
  var TAGS = [['all', 'Every tag'], ['toe-touch', 'toe-touch'], ['pull-up', 'pull-up'],
              ['mobility', 'mobility'], ['strength', 'strength'], ['recovery', 'recovery']];

  function kindChips(onPick) {
    var wrap = el('div', 'kinds');
    KINDS.forEach(function (pair) {
      wrap.appendChild(btn('chip' + (state.kind === pair[0] ? ' on' : ''), pair[1], function () {
        state.kind = pair[0];
        onPick();
      }));
    });
    return wrap;
  }

  function filteredMoves() {
    return state.moves.filter(function (m) {
      return (state.kind === 'all' || m.kind === state.kind) &&
             (state.tag === 'all' || m.tags.indexOf(state.tag) > -1);
    });
  }

  function moveCard(m) {
    var card = el('div', 'move');

    var slot = el('div', 'slot');
    slot.appendChild(el('div', 'note', 'illustration · ' + m.name.toLowerCase()));
    if (state.images.indexOf(m.id) > -1) {
      var img = el('img');
      img.src = 'images/' + m.id + '.png';
      img.alt = m.name;
      img.loading = 'lazy';
      img.addEventListener('error', function () { img.style.display = 'none'; });
      slot.appendChild(img);
    }
    card.appendChild(slot);

    var row = el('div', 'row');
    row.appendChild(el('div', 'name', m.name));
    row.appendChild(el('div', 'kind', m.kind === 'yoga' ? 'Yoga' : 'Calisthenics'));
    card.appendChild(row);

    card.appendChild(el('div', 'text', m.text));
    if (m.cue) card.appendChild(el('div', 'cue', m.cue));
    if (m.swap) card.appendChild(el('div', 'swap', m.swap));

    var tags = el('div', 'taglist');
    m.tags.forEach(function (t) { tags.appendChild(el('span', null, t)); });
    card.appendChild(tags);
    return card;
  }

  function renderLibrary() {
    var root = el('div', 'library');

    var head = el('div', 'head');
    head.appendChild(el('div', 'page-title', 'Library'));
    var moves = filteredMoves();
    head.appendChild(el('div', 'count', state.moves.length
      ? moves.length + ' of ' + state.moves.length + ' moves — read them like a book.'
      : 'Loading the shelf…'));
    root.appendChild(head);

    root.appendChild(kindChips(render));

    var tags = el('div', 'tags');
    TAGS.forEach(function (pair) {
      tags.appendChild(btn('chip' + (state.tag === pair[0] ? ' on' : ''), pair[1], function () {
        state.tag = pair[0];
        render();
      }));
    });
    root.appendChild(tags);

    var grid = el('div', 'grid');
    moves.forEach(function (m) { grid.appendChild(moveCard(m)); });
    root.appendChild(grid);
    return root;
  }

  // ——— routines ———
  function renderRoutines() {
    var root = el('div', 'routines');
    root.appendChild(el('div', 'page-title', 'Routines'));
    root.appendChild(el('div', 'sub', 'Curated playlists of library moves. Start a timer, or just read one.'));

    var list = el('div', 'routines-list');
    allRoutines().forEach(function (r) {
      var b = btn('routine-card', null, function () { openRoutine(r.id); });
      var row = el('div', 'row');
      row.appendChild(el('span', 'name', r.name));
      row.appendChild(el('span', 'meta', r.mins + ' min · ' + expand(r).length + ' moves'));
      b.appendChild(row);
      b.appendChild(el('div', 'note', r.note || ''));
      list.appendChild(b);
    });
    root.appendChild(list);

    root.appendChild(btn('build-cta', 'Build a routine', function () { go('builder'); }));
    return root;
  }

  // ——— routine detail ———
  function renderRoutine() {
    var r = routineById(state.routineId);
    var root = el('div', 'detail');
    root.appendChild(btn('back', '← Routines', function () { go('routines'); }));
    if (!r) return root;

    var steps = expand(r);
    root.appendChild(el('div', 'title', r.name));
    root.appendChild(el('div', 'meta', r.mins + ' min · ' + steps.length + ' moves'));
    root.appendChild(el('div', 'note', r.note || ''));
    if (r.credit) root.appendChild(el('div', 'credit', r.credit));

    var res = state.resume;
    var canResume = res && res.id === r.id && res.i > 0 && res.i < steps.length;

    var actions = el('div', 'actions');
    actions.appendChild(btn('btn-primary', canResume ? 'Start over' : 'Start session',
      function () { startPlayer(0); }));
    if (canResume) {
      actions.appendChild(btn('btn-quiet', 'Resume at ' + (res.i + 1), resumeSession));
    }
    if (r.custom) {
      actions.appendChild(btn('btn-quiet', 'Delete', function () {
        state.custom = state.custom.filter(function (c) { return c.id !== state.routineId; });
        save('reach.custom', state.custom);
        if (state.resume && state.resume.id === state.routineId) clearResume();
        go('routines');
      }));
    }
    root.appendChild(actions);

    var list = el('div', 'steps');
    steps.forEach(function (s, i) {
      var m = moveById(s.id);
      var bits = [];
      if (s.round) bits.push(s.round);
      if (s.side) bits.push(s.side);
      if (s.reps) bits.push(s.reps);
      if (!bits.length && m.tags && m.tags.length) bits.push(m.tags[0]);

      var row = el('div', 'step');
      row.appendChild(el('div', 'n', String(i + 1)));
      var mid = el('div', 'mid');
      mid.appendChild(el('div', 'name', m.name));
      mid.appendChild(el('div', 'sub', bits.join(' · ')));
      row.appendChild(mid);
      row.appendChild(el('div', 'dur', fmt(s.sec)));
      list.appendChild(row);
    });
    root.appendChild(list);
    return root;
  }

  // ——— builder ———
  function builderHintText() {
    var steps = state.builderSteps;
    if (!steps.length) return 'Pick moves below to start.';
    var mins = Math.max(1, Math.round(steps.reduce(function (a, s) { return a + Number(s.sec || 0); }, 0) / 60));
    return steps.length + ' moves · about ' + mins + ' min';
  }

  function renderBuilder() {
    var root = el('div', 'detail builder');
    root.appendChild(btn('back', '← Routines', function () { go('routines'); }));
    root.appendChild(el('div', 'title', 'Build a routine'));

    var nameInput = el('input', 'name-input');
    nameInput.placeholder = 'Name it';
    nameInput.value = state.builderName;
    nameInput.addEventListener('input', function () { state.builderName = nameInput.value; });
    root.appendChild(nameInput);

    var hint = el('div', 'hint', builderHintText());

    var list = el('div', 'bsteps');
    state.builderSteps.forEach(function (b, i) {
      var row = el('div', 'bstep');
      row.appendChild(el('div', 'name', b.name));

      var sec = el('input');
      sec.type = 'number';
      sec.value = String(b.sec);
      sec.addEventListener('input', function () {
        state.builderSteps[i].sec = sec.value;
        hint.textContent = builderHintText();
      });
      row.appendChild(sec);

      row.appendChild(el('span', 'unit', 'sec'));
      row.appendChild(btn('rm', '×', function () {
        state.builderSteps = state.builderSteps.filter(function (x, j) { return j !== i; });
        render();
      }));
      list.appendChild(row);
    });
    root.appendChild(list);
    root.appendChild(hint);

    root.appendChild(btn('btn-primary save', 'Save routine', saveRoutine));

    root.appendChild(el('div', 'eyebrow add-head', 'Add from library'));
    root.appendChild(kindChips(render));

    var picker = el('div', 'picker');
    state.moves
      .filter(function (m) { return state.kind === 'all' || m.kind === state.kind; })
      .forEach(function (m) {
        var b = btn('pick', null, function () {
          state.builderSteps = state.builderSteps.concat([{ id: m.id, name: m.name, sec: 45 }]);
          render();
        });
        b.appendChild(el('span', 'name', m.name));
        b.appendChild(el('span', 'plus', '+'));
        picker.appendChild(b);
      });
    root.appendChild(picker);
    return root;
  }

  function saveRoutine() {
    var steps = state.builderSteps;
    if (!steps.length) return;
    var total = Math.max(1, Math.round(steps.reduce(function (a, s) { return a + Number(s.sec || 0); }, 0) / 60));
    var r = {
      id: 'c' + Date.now(),
      name: state.builderName.trim() || 'Untitled routine',
      mins: total,
      note: 'Your routine.',
      custom: true,
      checkin: false,
      steps: steps.map(function (s) { return { id: s.id, sec: Number(s.sec) || 30, side: '', reps: '' }; }),
    };
    state.custom = state.custom.concat([r]);
    save('reach.custom', state.custom);
    state.builderName = '';
    state.builderSteps = [];
    openRoutine(r.id);
  }

  // ——— sound: a chime and a voice, so the screen is optional ———
  var actx = null;

  function initAudio() {
    if (!state.sound) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }

  function tone(freq, delay, dur, peak) {
    var t0 = actx.currentTime + delay;
    var osc = actx.createOscillator();
    var gain = actx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function chime(kind) {
    if (!state.sound || !actx) return;
    try {
      if (kind === 'transition') { tone(659.25, 0, 0.9, 0.09); tone(987.77, 0.15, 1.1, 0.055); }
      else if (kind === 'begin') { tone(523.25, 0, 0.75, 0.06); }
      else if (kind === 'done') { tone(523.25, 0, 0.8, 0.07); tone(659.25, 0.2, 0.9, 0.06); tone(783.99, 0.4, 1.6, 0.055); }
    } catch (e) {}
  }

  function speak(text) {
    if (!state.sound || !text) return;
    var synth = window.speechSynthesis;
    if (!synth || typeof SpeechSynthesisUtterance !== 'function') return;
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.92;
      u.volume = 0.9;
      synth.cancel();
      synth.speak(u);
    } catch (e) {}
  }
  function hush() {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  }

  function announce(step, prefix) {
    var m = moveById(step.id);
    speak((prefix || '') + m.name + (step.side ? '. ' + step.side : '') + (step.reps ? '. ' + step.reps : ''));
  }

  function toggleSound() {
    state.sound = !state.sound;
    save('reach.sound', state.sound);
    if (state.sound) { initAudio(); chime('begin'); } else { hush(); }
    if (ui) {
      ui.sound.textContent = state.sound ? 'Sound on' : 'Sound off';
      ui.sound.classList.toggle('on', state.sound);
    }
  }

  // ——— wake lock: a 90-second hold shouldn't end in a black screen ———
  var wakeLock = null;

  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock) return;
    try {
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }, function () {});
    } catch (e) {}
  }
  function releaseWakeLock() {
    if (!wakeLock) return;
    try { wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', function () {
    if (!state.player) return;
    if (document.visibilityState === 'visible') requestWakeLock();
    else saveResume();
  });
  window.addEventListener('pagehide', function () { if (state.player) saveResume(); });

  // ——— player ———
  var playerRoot = document.getElementById('player-root');
  var ui = null; // cached player nodes

  function startPlayer(startIndex) {
    var r = routineById(state.routineId);
    var steps = expand(r);
    if (!steps.length) return;
    var i = Math.min(Math.max(0, Number(startIndex) || 0), steps.length - 1);
    state.player = {
      routineId: r.id, i: i, steps: steps,
      phase: 'move',
      endAt: Date.now() + steps[i].sec * 1000,
      left: steps[i].sec * 1000,
      playing: true,
      breathStart: Date.now(),
    };
    state.view = 'player';
    initAudio(); // we're inside a click, which is the only place this is allowed
    requestWakeLock();
    saveResume();
    render();
    announce(steps[i]); // also warms up the speech engine for later transitions
  }

  function goStep(i, spoken) {
    var p = state.player;
    if (!p) return;
    if (i >= p.steps.length) { finishPlayer(); return; }
    if (i < 0) i = 0;
    p.i = i;
    p.phase = 'move';
    p.endAt = Date.now() + p.steps[i].sec * 1000;
    p.left = p.steps[i].sec * 1000;
    p.breathStart = Date.now();
    p.playing = true;
    chime('begin');
    if (!spoken) announce(p.steps[i]);
    saveResume();
    renderStep();
  }

  // The beat between moves: a few seconds of "here's what's coming".
  function beginTransition() {
    var p = state.player;
    var nxt = p.steps[p.i + 1];
    if (!nxt) { finishPlayer(); return; }
    p.phase = 'transition';
    p.endAt = Date.now() + TRANSITION_SEC * 1000;
    p.left = TRANSITION_SEC * 1000;
    chime('transition');
    announce(nxt, 'Next. ');
    saveResume();
    renderStep();
  }

  function finishPlayer() {
    chime('done');
    speak('Done.');
    clearResume();
    releaseWakeLock();
    state.player = null;
    state.view = 'routines';
    render();
  }

  function exitPlayer() {
    saveResume(); // where you actually left off
    hush();
    releaseWakeLock();
    state.player = null;
    state.view = 'routine';
    render();
  }

  function togglePlay() {
    var p = state.player;
    if (!p) return;
    if (p.playing) {
      p.playing = false;
      p.left = Math.max(0, p.endAt - Date.now());
      hush();
      saveResume();
    } else {
      p.playing = true;
      p.endAt = Date.now() + p.left;
      p.breathStart = Date.now();
    }
    ui.play.textContent = p.playing ? 'Pause' : 'Resume';
  }

  function buildPlayer() {
    var wrap = el('div', 'player');
    var col = el('div', 'col');

    var bar = el('div', 'bar');
    var fill = el('div');
    bar.appendChild(fill);
    col.appendChild(bar);

    var top = el('div', 'top');
    top.appendChild(btn('close', 'Close', exitPlayer));
    var right = el('div', 'right');
    var sound = btn('sound' + (state.sound ? ' on' : ''), state.sound ? 'Sound on' : 'Sound off', toggleSound);
    right.appendChild(sound);
    var progress = el('div', 'progress');
    right.appendChild(progress);
    top.appendChild(right);
    col.appendChild(top);

    var pinned = el('div', 'pinned');
    var side = el('div', 'side');
    var pose = el('div', 'pose');
    pinned.appendChild(side);
    pinned.appendChild(pose);
    col.appendChild(pinned);

    var scroll = el('div', 'scroll');

    var illus = el('div', 'illus');
    var illusNote = el('div', 'note');
    var illusImg = el('img');
    illusImg.alt = '';
    illusImg.addEventListener('error', function () { illusImg.classList.add('hidden'); });
    illus.appendChild(illusNote);
    illus.appendChild(illusImg);
    scroll.appendChild(illus);

    var breath = el('div', 'breath');
    var breathFill = el('div', 'fill');
    var time = el('div', 'time');
    breath.appendChild(breathFill);
    breath.appendChild(el('div', 'ring'));
    breath.appendChild(time);
    scroll.appendChild(breath);
    var breathLabel = el('div', 'breath-label');
    scroll.appendChild(breathLabel);
    var text = el('div', 'text');
    scroll.appendChild(text);
    var cue = el('div', 'cue');
    scroll.appendChild(cue);
    col.appendChild(scroll);

    var controls = el('div', 'controls');
    var back = btn('step-btn', 'Back', function () {
      var p = state.player;
      // Mid-beat, "Back" means "let me stay where I was a moment longer".
      goStep(p.phase === 'transition' ? p.i : p.i - 1);
    });
    controls.appendChild(back);
    var play = btn('play', 'Pause', togglePlay);
    controls.appendChild(play);
    var skip = btn('step-btn', 'Skip', function () {
      var p = state.player;
      goStep(p.i + 1, p.phase === 'transition');
    });
    controls.appendChild(skip);
    col.appendChild(controls);

    var next = el('div', 'next');
    var nextThumb = el('div', 'thumb');
    var nextThumbImg = el('img');
    nextThumbImg.alt = '';
    nextThumbImg.addEventListener('error', function () { nextThumb.classList.add('empty'); });
    nextThumb.appendChild(nextThumbImg);
    var nextText = el('span');
    next.appendChild(nextThumb);
    next.appendChild(nextText);
    col.appendChild(next);

    wrap.appendChild(col);
    playerRoot.appendChild(wrap);

    ui = { wrap: wrap, fill: fill, progress: progress, side: side, pose: pose, breathFill: breathFill,
           time: time, breathLabel: breathLabel, text: text, cue: cue, play: play, sound: sound,
           back: back, skip: skip, illus: illus, illusImg: illusImg, illusNote: illusNote,
           nextThumb: nextThumb, nextThumbImg: nextThumbImg, nextText: nextText };
  }

  function paintIllus(m) {
    ui.illusNote.textContent = 'illustration · ' + m.name.toLowerCase();
    var src = imagePath(m.id);
    if (!src) { ui.illusImg.classList.add('hidden'); return; }
    if (ui.illusImg.getAttribute('src') !== src) ui.illusImg.setAttribute('src', src);
    ui.illusImg.alt = m.name;
    ui.illusImg.classList.remove('hidden');
  }

  function paintNextThumb(id) {
    var src = id ? imagePath(id) : '';
    if (!src) { ui.nextThumb.classList.add('empty'); return; }
    if (ui.nextThumbImg.getAttribute('src') !== src) ui.nextThumbImg.setAttribute('src', src);
    ui.nextThumb.classList.remove('empty');
  }

  function preload(id) {
    var src = id ? imagePath(id) : '';
    if (src) { var img = new Image(); img.src = src; }
  }

  function renderStep() {
    var p = state.player;
    if (!p || !ui) return;
    var transition = p.phase === 'transition';
    // In the beat between moves, the screen belongs to the move you're heading into.
    var shown = transition ? p.steps[p.i + 1] : p.steps[p.i];
    var upcoming = transition ? p.steps[p.i + 2] : p.steps[p.i + 1];
    var m = moveById(shown.id);

    ui.wrap.classList.toggle('is-transition', transition);
    ui.side.textContent = transition
      ? 'Next' + (shown.side ? ' · ' + shown.side : '')
      : (shown.side || shown.round || '');
    ui.pose.textContent = m.name;
    ui.text.textContent = m.text;
    paintIllus(m);

    var openingThought = !transition && p.i === 0 && shown.id === 'childs_pose' && state.thoughts.length;
    var cue = openingThought ? 'A thought to sit with — ' + todaysThought() : (m.cue || '');
    ui.cue.textContent = cue;
    ui.cue.classList.toggle('hidden', !cue);

    ui.progress.textContent = (transition ? p.i + 2 : p.i + 1) + ' / ' + p.steps.length;
    ui.nextText.textContent = upcoming
      ? (transition ? 'Then — ' : 'Next — ') + moveById(upcoming.id).name + (upcoming.side ? ' · ' + upcoming.side : '')
      : 'Last one.';
    paintNextThumb(upcoming && upcoming.id);
    preload(upcoming && upcoming.id);

    ui.back.textContent = transition ? 'Repeat' : 'Back';
    ui.skip.textContent = transition ? 'Start now' : 'Skip';
    ui.play.textContent = p.playing ? 'Pause' : 'Resume';
    paintTime();
  }

  function paintTime() {
    var p = state.player;
    var left = Math.max(0, Math.ceil(p.left / 1000));
    var frac;
    if (p.phase === 'transition') {
      ui.time.textContent = String(Math.max(1, left));
      frac = p.i + 1;
    } else {
      ui.time.textContent = fmt(left);
      frac = p.i + (1 - p.left / (p.steps[p.i].sec * 1000));
    }
    ui.fill.style.width = Math.round((frac / p.steps.length) * 100) + '%';
  }

  function tick() {
    var p = state.player;
    if (!p || !p.playing || !ui) return;
    var now = Date.now();
    if (now >= p.endAt) {
      if (p.phase === 'transition') goStep(p.i + 1, true);
      else beginTransition();
      return;
    }

    p.left = p.endAt - now;

    if (p.phase === 'transition') {
      // The circle draws in as the beat runs out.
      var t = p.left / (TRANSITION_SEC * 1000);
      ui.breathFill.style.transform = 'scale(' + (Math.round((0.62 + 0.38 * t) * 1000) / 1000) + ')';
      ui.breathLabel.textContent = 'Get ready';
      paintTime();
      return;
    }

    var r = routineById(p.routineId);
    var b = (r && r.breath) || { cycle: BREATH_CYCLE, inhale: Math.round(BREATH_CYCLE / 2) };
    var bt = ((now - p.breathStart) / 1000) % b.cycle;
    var inhaling = bt < b.inhale;
    var prog = inhaling ? bt / b.inhale : (bt - b.inhale) / (b.cycle - b.inhale);
    var eased = (1 - Math.cos(Math.PI * prog)) / 2;
    var scale = inhaling ? 0.6 + 0.4 * eased : 1 - 0.4 * eased;

    ui.breathFill.style.transform = 'scale(' + (Math.round(scale * 1000) / 1000) + ')';
    ui.breathLabel.textContent = inhaling ? 'Inhale' : 'Exhale';
    paintTime();
  }

  // ——— chrome ———
  var NAV = [['home', 'Home'], ['library', 'Library'], ['routines', 'Routines']];

  function renderNav(container) {
    clear(container);
    NAV.forEach(function (pair) {
      var active = state.view === pair[0] ||
        (pair[0] === 'routines' && (state.view === 'routine' || state.view === 'builder'));
      container.appendChild(btn(active ? 'on' : null, pair[1], function () { go(pair[0]); }));
    });
  }

  function render() {
    var view = state.view;
    var shell = document.getElementById('shell');
    var viewRoot = document.getElementById('view');

    shell.classList.toggle('wide', view === 'home' || view === 'library' || view === 'routines');

    var inPlayer = view === 'player';
    document.getElementById('topnav').classList.toggle('hidden', inPlayer);
    document.getElementById('navbar').classList.toggle('hidden', inPlayer);
    document.getElementById('topnav-wordmark').textContent = view === 'home' ? '' : 'Reach';
    renderNav(document.getElementById('topnav-links'));
    renderNav(document.getElementById('navbar-links'));

    if (inPlayer) {
      if (!ui) buildPlayer();
      renderStep();
    } else if (ui) {
      clear(playerRoot);
      ui = null;
    }

    clear(viewRoot);
    if (view === 'home') viewRoot.appendChild(renderHome());
    else if (view === 'library') viewRoot.appendChild(renderLibrary());
    else if (view === 'routines') viewRoot.appendChild(renderRoutines());
    else if (view === 'routine') viewRoot.appendChild(renderRoutine());
    else if (view === 'builder') viewRoot.appendChild(renderBuilder());
  }

  // ——— boot ———
  function boot() {
    var d = window.REACH_DATA;
    if (!d) { setTimeout(boot, 60); return; }
    state.moves = d.MOVES;
    state.routines = d.ROUTINES;
    state.thoughts = d.THOUGHTS;
    state.images = d.IMAGES || [];
    state.custom = load('reach.custom', []) || [];
    state.resume = load('reach.resume', null);
    state.sound = load('reach.sound', true) !== false;
    state.ready = true;

    // A resume entry only counts if it points at a live routine and a real position
    // in it. Entries from the old "saved on browse" behaviour have no position.
    var res = state.resume;
    var r = res && routineById(res.id);
    if (!r || typeof res.i !== 'number') {
      clearResume();
    } else {
      var steps = expand(r);
      if (res.i >= steps.length) clearResume();
    }

    render();
    setInterval(tick, 100);
  }

  boot();
})();
</script>
</body>
</html>
